<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welvors Event - View & Book Tickets</title>
 
  <!-- Open Graph / WhatsApp Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Join this exciting event on Welvors!">
  <meta property="og:description" content="View details, reserve your spot, and meet amazing people on Welvors.">
  <meta property="og:image" content="https://www.welvors.com/assets/images/event_preview.png">
  <meta name="twitter:card" content="summary_large_image">
 
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #FFF0F4 0%, #FFFFFF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1A1A1A;
    }
    .card {
      background: #FFFFFF;
      max-width: 420px;
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 14px 40px rgba(228, 58, 106, 0.12);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid rgba(228, 58, 106, 0.1);
    }
    .badge {
      display: inline-block;
      background: #FFE8EE;
      color: #E43A6A;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 24px; font-weight: 800; color: #111; margin-bottom: 10px; line-height: 1.3; }
    p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 28px; }
    .cta-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #E43A6A 0%, #C72052 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(228, 58, 106, 0.35);
      transition: transform 0.15s ease;
      margin-bottom: 14px;
      border: none;
      cursor: pointer;
    }
    .cta-btn:active { transform: scale(0.98); }
    .sub-text { font-size: 13px; color: #888; }
  </style>
</head>
<body>
 
  <div class="card">
    <div class="badge">Welvors Events</div>
    <h1>Exclusive Event Invitation</h1>
    <p>You've been invited to view this event on Welvors. Open the app to see full details, schedule, location, and reserve your tickets.</p>
 
    <button class="cta-btn" onclick="handleOpenApp()">Open Event in App</button>
    <div class="sub-text" id="statusText">Redirecting you to the app...</div>
  </div>
 
  <script>
    function getEventId() {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      if (pathSegments.length >= 2 && (pathSegments[0] === 'event' || pathSegments[0] === 'events')) {
        return pathSegments[1];
      }
      const params = new URLSearchParams(window.location.search);
      return params.get('eventId') || params.get('id') || '';
    }
 
    const eventId = getEventId();
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
 
    const playStoreUrl = `https://play.google.com/store/apps/details?id=com.infynod.welvors&referrer=welvors_event%3D${encodeURIComponent(eventId)}`;
    const appStoreUrl = `https://apps.apple.com/app/welvors/id6738914876`;
    const appSchemeUrl = `welvors://event/${eventId}`;
 
    function handleOpenApp() {
      if (isAndroid) {
        window.location.href = appSchemeUrl;
        setTimeout(() => { window.location.href = playStoreUrl; }, 1200);
      } else if (isIOS) {
        window.location.href = appSchemeUrl;
        setTimeout(() => { window.location.href = appStoreUrl; }, 1200);
      } else {
        alert("Please open this link on your mobile phone to view event details.");
      }
    }
 
    window.addEventListener('DOMContentLoaded', () => {
      if (isAndroid) {
        document.getElementById('statusText').innerText = "Opening Welvors App...";
        window.location.href = appSchemeUrl;
        setTimeout(() => { window.location.href = playStoreUrl; }, 1500);
      } else if (isIOS) {
        document.getElementById('statusText').innerText = "Opening Welvors App...";
        window.location.href = appSchemeUrl;
        setTimeout(() => { window.location.href = appStoreUrl; }, 1500);
      } else {
        document.getElementById('statusText').innerText = "Open this link on your smartphone to view event details.";
      }
    });
  </script>
</body>
</html>
